# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
early_access: false
reviews:
  profile: 'chill'
  high_level_summary: true
  poem: false
  path_filters: ['!tests/**', '!**/generated/**', '!**/baseplate/snapshots/**']
  auto_review:
    # Only review PRs that opt in with the `coderabbit-review` label.
    enabled: false
    labels: ['coderabbit-review']
chat:
  auto_reply: true
