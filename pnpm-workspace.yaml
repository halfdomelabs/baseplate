packages:
  - packages/*
  - plugins/*

blockExoticSubdeps: true

catalog:
  '@eslint/js': ^9.39.5
  '@module-federation/enhanced': ^2.7.0
  '@module-federation/vite': 1.17.0
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^24.12.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': 6.0.5
  cpx2: 9.0.0
  eslint: ^9.39.5
  nodemon: 3.1.14
  oxlint: 1.76.0
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: 4.3.3
  tsx: 4.23.1
  typescript: 6.0.3
  'typescript-eslint': ^8.65.0
  vite: 8.2.0
  vite-plugin-svgr: 5.2.0
  vitest: 4.1.10
  zod: ~4.3.6

ignoredBuiltDependencies:
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - cpu-features
  - esbuild
  - protobufjs
  - ssh2
  - unrs-resolver

linkWorkspacePackages: true

minimumReleaseAge: 1440

publishBranch: main

saveWorkspaceProtocol: rolling

dedupePeers: true

allowBuilds:
  '@prisma/engines': false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - js-yaml@3.15.0
  - adm-zip@0.6.0
  - brace-expansion@2.1.2
  - brace-expansion@1.1.16
  - brace-expansion@5.0.7
  - js-yaml@4.3.0
  - shell-quote@1.8.5
  - protobufjs@7.6.5
  - body-parser@2.3.0
