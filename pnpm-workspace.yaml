packages:
  - packages/*

blockExoticSubdeps: true

catalogMode: strict

catalog:
  '@tailwindcss/vite': 4.3.3
  '@types/node': ^24.13.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': 6.0.5
  change-case: ^5.4.4
  cpx2: 9.0.0
  es-toolkit: ^1.50.0
  globby: ^16.2.2
  memfs: 4.64.0
  oxlint: 1.76.0
  p-limit: ^7.3.1
  prettier: ^3.9.6
  react: ^19.2.8
  react-dom: ^19.2.8
  tailwindcss: 4.3.3
  ts-morph: ^28.0.0
  tsx: 4.23.1
  typescript: 7.0.2
  vite: 8.3.5
  vite-plugin-svgr: 5.2.0
  vitest: 5.1.0
  yaml: ^2.8.3
  zod: ~4.3.6

ignoredBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild

linkWorkspacePackages: true

packageExtensions:
  # Imports zod/v4/core without declaring it, so it would otherwise type-check
  # against whichever zod pnpm hoists
  '@hookform/resolvers':
    peerDependencies:
      zod: '*'

minimumReleaseAge: 1440

publishBranch: main

saveWorkspaceProtocol: rolling

dedupePeers: true

autoDedupe: true

allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - esbuild@0.28.1

lockfile:
  includeResolutionSettings: true
