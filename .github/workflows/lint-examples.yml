name: Lint Examples

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
  push:
    branches: [main]
    paths:
      - 'examples/**'

jobs:
  discover:
    name: Discover Examples
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.list-examples.outputs.examples }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List example directories
        id: list-examples
        run: |
          # List directories in examples folder and format as JSON array
          cd examples
          directories=($(find . -maxdepth 1 -type d -not -name "." | sed 's|./||' | sort))

          # Create JSON array
          json_array=()
          for dir in "${directories[@]}"; do
            json_array+=("\"$dir\"")
          done

          # Join array elements with commas
          json_elements=$(IFS=,; echo "${json_array[*]}")
          json_output="[${json_elements}]"

          echo "Found examples: $json_output"
          echo "examples=$json_output" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint Examples
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      matrix:
        example: ${{ fromJSON(needs.discover.outputs.examples) }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0
      - name: Copy backend/.env secrets
        run: |
          echo "$BLOG_WITH_AUTH_BACKEND_ENV" > ./examples/blog-with-auth/apps/backend/.env
          echo "$TODO_WITH_BETTER_AUTH_BACKEND_ENV" > ./examples/todo-with-better-auth/apps/backend/.env
        env:
          BLOG_WITH_AUTH_BACKEND_ENV: ${{secrets.BLOG_WITH_AUTH_BACKEND_ENV}}
          TODO_WITH_BETTER_AUTH_BACKEND_ENV: ${{secrets.TODO_WITH_BETTER_AUTH_BACKEND_ENV}}

      - name: Derive appropriate SHAs for base for `turbo --affected` commands
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      - name: Set environment variable for Turborepo
        run: echo "TURBO_SCM_BASE=$NX_BASE" >> $GITHUB_ENV

      - name: Cache turbo build setup
        uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1
        with:
          cache-prefix: examples-${{ matrix.example }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: examples/${{ matrix.example }}/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: examples/${{ matrix.example }}/package.json
          cache: pnpm
          cache-dependency-path: examples/${{ matrix.example }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: examples/${{ matrix.example }}

      # Examples are nested inside the Baseplate monorepo only in CI; a real
      # generated project is standalone. Vite 8's
      # resolve.tsconfigPaths walks up the directory tree and picks up the repo
      # root tsconfig.json, whose extends chain references @baseplate-dev/tools
      # (not installed in the example's isolated node_modules), breaking the
      # build. Removing the root tsconfig here makes CI match a standalone
      # project. See vitejs/vite#21856 and rolldown/rolldown#8732.
      - name: Remove root tsconfig.json (examples are standalone projects)
        run: rm -f tsconfig.json

      - name: Run Docker setup
        run: docker compose up -d
        working-directory: examples/${{ matrix.example }}/docker

      - name: Run prettier check
        run: pnpm prettier:check
        working-directory: examples/${{ matrix.example }}

      - name: Run build
        run: pnpm build
        working-directory: examples/${{ matrix.example }}

      - name: Run lint
        run: pnpm lint
        working-directory: examples/${{ matrix.example }}

      - name: Run typecheck
        run: pnpm typecheck
        working-directory: examples/${{ matrix.example }}

      - name: Run tests
        run: pnpm test
        working-directory: examples/${{ matrix.example }}
