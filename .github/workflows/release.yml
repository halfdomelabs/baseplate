name: Release

# Publishing is frozen during the rebuild. Re-enable the push trigger (or
# replace this with the prerelease workflow, ENG-1323) for the first
# early-access release.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: false
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js and pnpm
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # Node comes from mise; setup-node only writes the npm registry config
      - name: Configure npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          scope: '@baseplate-dev'

      - name: Upgrade npm to v11 # Necessary for trusted publishing
        run: npm install -g npm@11
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm run version
          pr-title: 'chore: Version Packages'
          # We create a single combined baseplate@{version} tag and release below
          create-github-releases: false
          push-git-tags: false

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: node ./scripts/create-github-release.ts
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format Packages for Slack
        if: steps.changesets.outputs.published == 'true'
        id: format-packages
        run: |
          {
            echo "FORMATTED_PACKAGES<<EOF"
            echo '${{ steps.changesets.outputs.published-packages }}' | jq -c 'map(
              {
                type: "rich_text_section",
                elements: [
                  {
                    type: "text",
                    text: .name,
                    style: { bold: true }
                  },
                  {
                    type: "text",
                    text: ": "
                  },
                  {
                    type: "text",
                    text: .version
                  }
                ]
              }
            )'
            echo EOF
            } >> "$GITHUB_OUTPUT"

      - name: Send a Slack notification if a publish happens
        if: steps.changesets.outputs.published == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "New versions of Baseplate packages were just released!",
              "blocks": [
                {
                  "type": "rich_text",
                  "elements": [
                    {
                      "type": "rich_text_section",
                      "elements": [
                        {
                          "type": "text",
                          "text": "New versions of Baseplate packages were just released:"
                        }
                      ]
                    },
                    {
                      "type": "rich_text_list",
                      "elements": ${{ steps.format-packages.outputs.FORMATTED_PACKAGES}},
                      "style": "bullet"
                    }
                  ]
                }
              ]
            }
