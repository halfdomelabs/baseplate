name: Test E2E

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We need to fetch all branches and commits so that Nx affected has a base to compare against.
          fetch-depth: 0
      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
      - name: Set environment variable for Turborepo
        run: echo "TURBO_SCM_BASE=$NX_BASE" >> $GITHUB_ENV
      - name: Cache turbo build setup
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: get-playwright-version
        working-directory: packages/project-builder-cli
        shell: bash
        run: |
          version=$(jq -r '.devDependencies["@playwright/test"]' package.json | sed 's/^[^0-9]*//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: 'playwright-browsers-${{ runner.os }}-${{ steps.get-playwright-version.outputs.version }}'

      - name: Install Playwright with dependencies
        run: pnpm playwright install --with-deps
        working-directory: packages/project-builder-cli

      - name: Run E2E Tests
        run: pnpm test:e2e:affected

      - name: Test generation
        run: pnpm test:gen
